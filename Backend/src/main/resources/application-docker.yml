server:
  port: ${SERVER_PORT:8080}

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://mysql:3306/labelhub?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      pool-name: LabelHubHikariPool
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-timeout: 30000
      validation-timeout: 5000
      connection-test-query: SELECT 1

  data:
    redis:
      host: ${SPRING_REDIS_HOST:redis}
      port: ${SPRING_REDIS_PORT:6379}
      database: ${SPRING_REDIS_DATABASE:0}
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
      password: ${SPRING_REDIS_PASSWORD}

  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:rabbitmq}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:labelhub}
    password: ${SPRING_RABBITMQ_PASSWORD}
    virtual-host: ${SPRING_RABBITMQ_VHOST:/}

mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

sa-token:
  token-name: satoken
  token-prefix: LabelHub
  timeout: 7200
  active-timeout: 1800
  is-concurrent: true
  is-share: false
  is-log: false
  is-read-header: true
  is-read-cookie: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

knife4j:
  enable: true
  setting:
    language: zh_cn

labelhub:
  upload:
    path: ${LABELHUB_UPLOAD_PATH:/app/uploads}
  minio:
    endpoint: ${LABELHUB_MINIO_ENDPOINT:http://minio:9000}
    public-url: ${LABELHUB_MINIO_PUBLIC_URL:http://127.0.0.1:9000}
    access-key: ${LABELHUB_MINIO_ACCESS_KEY:labelhub}
    secret-key: ${LABELHUB_MINIO_SECRET_KEY}
  agent:
    token: ${LABELHUB_AGENT_TOKEN:}
    base-url: ${LABELHUB_AGENT_BASE_URL:http://agent-web:5001}
